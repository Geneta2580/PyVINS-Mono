# ----------------------------------------------------------------------------
# 数据集参数 (Dataset Parameters)
# ----------------------------------------------------------------------------
# 数据集根目录。已导出为 EuRoC 布局：mav0/cam0 与 mav0/imu0。
# 标定来源：kalibr_imucam_chain.yaml、kalibr_imu_chain.yaml
dataset_path: "/home/geneta/dataset/ORI/r02"

# 支持euroc\tum\kitti数据集
dataset_type: "euroc"

# Kalibr 约定：t_imu = t_cam + timeshift_cam_imu。
# 负值把每个相机时间戳在 IMU 时钟上提前 4.024710 ms。
apply_timeshift_cam_imu: true
timeshift_cam_imu: -0.004024710194977835

# ============================================= 视觉前端配置参数 =============================================
# 初始化三角化两帧视差阈值
initial_parallax: 30
initial_min_matches: 20

# 初始SFM三角化重投影误差阈值
initial_sfm_reprojection_threshold: 1.5

# 选择关键帧最小视差，单位像素
keyframe_parallax: 10

# 关键帧最小跟踪特征点数
keyframe_min_tracked: 20

# 静止视差
min_stationary_parallax: 0.5

# 最大特征点数
max_features_to_detect: 150

# 最小跟踪比例
min_track_ratio: 0.5

# ORI cam0 约 30 Hz，按 10 Hz 向估计器发布。
estimator_publish_hz: 10

# 特征点间的最小像素距离
min_dist: 30

# 相机内参。fisheye.undistortPoints 使用 P=K，此 K 同时作为后续针孔模型内参。
cam_intrinsics: [463.9994465216521, 0.0, 735.024509773121,
                 0.0, 463.25045311566834, 719.708087825285,
                 0.0, 0.0, 1.0]

# 相机畸变参数。Kalibr cam0 为 pinhole + equidistant。
use_undistort: true
distortion_model: "fisheye"
distortion_coefficients: [0.031511281195814984,
                          -0.011653488085419278,
                          -0.0021546766344171507,
                          0.00021719584539155157]

# 是否使用IMU预积分旋转预测光流初值。当前预测仍按针孔投影回原图，先关闭。
use_imu_flow_prediction: False

# 灰度预处理：CLAHE 对比度限制，高斯核边长（奇数）
clahe_clip_limit: 3.0
gaussian_kernel_size: 1

# RANSAC相关参数
use_ransac: True
ransac_threshold: 1.0
ransac_prob: 0.999

# 是否可视化追踪结果。光流窗口宽度固定，高度按图像宽高比缩放。
visualize: True
visualize_window_width: 960

# ============================================= IMU配置参数 =============================================
# 重力模长
gravity: 9.81007

# 注意这里只是sigma，不是sigma^2。数值来自 kalibr_imu_chain.yaml。
accel_noise_sigma: 0.0005619744336087213
gyro_noise_sigma: 0.00007495229511447645
accel_bias_rw_sigma: 0.00013987339606410704
gyro_bias_rw_sigma: 0.00003438086057268726

# ============================================= 地图管理参数 =============================================
# 三角化新地图点条件检查
max_depth: 60 # 地图点三角化深度检查是否正常
min_depth: 0.2
min_parallax_angle_deg: 0.5 # 三角化新地图点最小视差角度
triangulation_max_reprojection_error: 5.0 # 三角化新地图点最大重投影误差（每一帧的重投影误差不超过5px）

# 优化新地图点最大重投影误差
optimization_max_reprojection_error: 30.0 # 地图点进入优化窗口的最大重投影误差
optimization_max_delete_reprojection_error: 40.0 # 优化新地图点最大删除重投影误差(只有开启优化后抑制不良优化点才有效)

# ============================================= 后端配置参数 =============================================
# 滑窗大小
window_size: 10

# 初始化窗口大小
init_window_size: 11
init_quality_gate: true
init_min_alignment_attempts: 2
init_min_span: 0.8
init_min_excitation: 0.25
init_max_gravity_error: 1.0
init_max_condition_number: 1.0e8
init_max_gyro_bias: 0.5
init_max_scale_change: 0.20

# 初始化外参。T_wc = T_wb * T_bc，即相机坐标到 IMU/机体坐标。
# Kalibr 给出 T_cam_imu，这里保存的是它的逆。
T_bc: [-0.0025095884935861, -0.9999911404677392, -0.0033794898461801, -0.0155562526337425,
       -0.0079515608875705, -0.0033594385529658,  0.9999627427319766,  0.0241549497167225,
       -0.9999652367182779,  0.0025363672124558, -0.0079430596321228,  0.0203856532103737,
        0.0,                 0.0,                 0.0,                 1.0]

# 视觉噪声sigma
visual_noise_sigma: 1.5
visual_robust_kernel: cauchy

# 低视差零速先验。关闭后不再加入 σ=0.03 m/s 的速度约束。
use_zupt: false

# ============================================= 回环检测 =============================================
# SALAD 在独立线程中生成全局描述子；队列满时丢弃最旧任务，不阻塞 VIO。
enable_loop_detection: true
loop_detector_salad_path: "submodule/salad"
# DINOv2 代码使用现有本地官方仓库；推理期间不通过 Torch Hub 联网。
loop_detector_dinov2_path: "/home/geneta/project/dinov2"
loop_detector_salad_checkpoint: "checkpoints/dino_salad.ckpt"
loop_detector_dinov2_checkpoint: "checkpoints/dinov2_vitb14_pretrain.pth"
loop_detector_device: "cuda"
loop_detector_allow_cpu: false
loop_detector_image_size: [322, 322]
loop_detector_use_amp: true
# 当前关键帧与最佳候选帧并排显示；缩略图压缩后保存在描述子库中。
loop_detector_visualize: true
loop_detector_visualization_width: 480
loop_detector_visualization_jpeg_quality: 80
loop_detector_queue_size: 2
loop_detector_result_queue_size: 8
loop_detector_min_frame_gap: 30
loop_detector_top_k: 5
loop_detector_similarity_threshold: 0.85
# 局部回环特征：当前关键帧使用KLT坐标计算BRIEF，历史关键帧使用FAST+BRIEF。
loop_detector_fast_threshold: 20
loop_detector_fast_max_keypoints: 500
loop_detector_brief_bytes: 32
loop_detector_brief_ratio_threshold: 0.80
loop_detector_brief_max_distance: 80
# BRIEF匹配后的本质矩阵RANSAC：像素阈值、置信度和启动估计所需的最少匹配数。
loop_detector_ransac_threshold: 1.0
loop_detector_ransac_prob: 0.999
loop_detector_ransac_min_matches: 8

# PnP和4DoF全局位姿图在独立进程中运行，Estimator只提交快照和应用结果。
enable_loop_optimization: true
loop_optimization_queue_size: 1
loop_optimization_result_queue_size: 2
# 数据结束时最多等待一个在途PGO结果的秒数，防止退出阶段无限卡住。
loop_optimization_shutdown_wait_sec: 2.0
loop_pnp_min_points: 12
loop_pnp_min_inliers: 10
loop_pnp_min_inlier_ratio: 0.45
loop_pnp_reprojection_error: 3.0
loop_pnp_confidence: 0.999
loop_pnp_iterations: 200
loop_pnp_max_translation: 100.0
# 顺序边和回环边的平移sigma（米）与yaw sigma（度）。
loop_pgo_odometry_translation_sigma: 0.10
loop_pgo_odometry_yaw_sigma_deg: 3.0
loop_pgo_loop_translation_sigma: 0.05
loop_pgo_loop_yaw_sigma_deg: 2.0
# 每帧重力方向约束，锁定roll/pitch但保留全局yaw自由度。
loop_pgo_attitude_sigma_deg: 0.1
loop_pgo_anchor_sigma: 1.0e-6
loop_pgo_huber_k: 1.345
loop_pgo_relative_error_tol: 1.0e-5
loop_pgo_absolute_error_tol: 1.0e-5
loop_pgo_max_iterations: 50

# ============================================= 输出结果配置 =============================================
# 是否使用IMU输出
use_imu_output: False

# 是否可视化
enable_viewer: False

# 输出日志文件路径
log_dir: "output/ori/log"

# 帧率统计：每帧记录 instant_fps / avg_fps；结束时打印平均帧率
enable_fps_stats: True
# 运行中每隔 N 帧打印一次 FPS（0 表示仅结束时打印）
fps_report_interval: 0

# 输出轨迹文件路径
trajectory_output_path: "output/ori/estimated_trajectory.txt"
# 数据结束时一次性写出的PGO全局修正轨迹（TUM格式，相机帧频率）。
loop_corrected_trajectory_output_path: "output/ori/estimated_trajectory_loop_corrected.txt"
